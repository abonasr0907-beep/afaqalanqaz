        /* Header */
        .header {

            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header-content {

            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;

        }

            align-items: center;
            gap: 1.2rem;
        }

            color: var(--white);
            font-size: 1.6rem;
            box-shadow: 0 4px 15px rgba(201, 169, 97, 0.3);

        .logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--charcoal);
        }
        .logo-text span {
            font-size: 0.75rem;

            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.3rem;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--charcoal);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            color: var(--gold-dark);
        }
        .contact-buttons {
            display: flex;
            gap: 1rem;
        }
        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-telegram {
            background: var(--charcoal);
            color: var(--white);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--white);
        }
