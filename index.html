<script>
  // التوكن الجديد ومعرف حسابك للأدمن
  const TELEGRAM_BOT_TOKEN = '8881283361:AAGQ7Qwt1tlkvHyUtkHbGs1x5E5Yh7LzIuU';
  const TELEGRAM_ADMIN_CHAT_ID = '8298395488';

  /**
   * دالة لإرسال إشعار أو تعليق جديد إلى تليجرام
   * @param {string} messageText - النص المراد إرساله
   */
  async function sendNotificationToTelegram(messageText) {
    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat_id: TELEGRAM_ADMIN_CHAT_ID,
          text: messageText,
          parse_mode: 'HTML'
        })
      });

      const data = await response.json();
      if (data.ok) {
        console.log('تم إرسال الإشعار بنجاح إلى تليجرام!');
      } else {
        console.error('حدث خطأ أثناء الإرسال:', data.description);
      }
    } catch (error) {
      console.error('خطأ في الاتصال بـ Telegram API:', error);
    }
  }

  // مثال على الاستخدام عند إرسال تعليق أو طلب جديد من الموقع:
  // sendNotificationToTelegram('<b>💬 تعليق جديد من الموقع:</b>\nقام أحد الزوار بإضافة تعليق جديد على العقار رقم #102');
</script>
